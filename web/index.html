<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0052d9">
  <title>ChainWeaver</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#board">跳到主要内容</a>

  <header class="app-header">
    <div class="header-main-row">
      <div class="header-brand">
        <div class="header-logo-icon" aria-hidden="true">
          <!-- 与 favicon 同一枚 C 字标：渐变圆角方块 + 细线 C + 三块站点方块。 -->
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2b7fff"/><stop offset="1" stop-color="#0040b0"/>
            </linearGradient></defs>
            <rect width="64" height="64" rx="14" fill="url(#brandg)"/>
            <path d="M42.5 16.5A17.8 17.8 0 1 0 42.5 47.5" fill="none" stroke="#fff"
              stroke-width="5.6" stroke-linecap="round"/>
            <rect x="26" y="21.5" width="6.8" height="6.8" rx="2" fill="#fff" opacity=".95"/>
            <rect x="32.4" y="28.6" width="6.8" height="6.8" rx="2" fill="#fff" opacity=".78"/>
            <rect x="26" y="35.7" width="6.8" height="6.8" rx="2" fill="#fff" opacity=".6"/>
          </svg>
        </div>
        <div class="header-title">
          <h1 id="portal-title">ChainWeaver</h1>
        </div>
      </div>

      <nav class="header-nav" aria-label="站点导航">
        <div class="nav-tabs" id="nav-tabs" role="tablist"></div>
      </nav>
    </div>
  </header>

  <!-- 首页视图：站点清单 -->
  <!-- 研发工作台：按开发 / 测试 / 运维分组。分组本身承载语义，
       不再写「某个分组的说明」这类复述性文案。 -->
  <main class="app-main" id="view-home">
    <div class="wb-head">
      <h1>研发工作台</h1>
    </div>

    <section class="wb-group" data-group="dev">
      <h2 class="wb-group-head">开发</h2>
      <div class="wb-cards" id="grid-dev"></div>
    </section>

    <section class="wb-group" data-group="test">
      <h2 class="wb-group-head">测试</h2>
      <div class="wb-cards" id="grid-test"></div>
    </section>

    <section class="wb-group" data-group="ops">
      <h2 class="wb-group-head">运维</h2>
      <div class="wb-cards" id="grid-ops"></div>
    </section>

    <p class="loading" id="loading">正在加载站点清单…</p>
  </main>


  <!-- 站点内嵌：顶部签栏保留，内容区用 iframe 承载站点 -->
  <main class="app-main app-main--embed" id="view-site" hidden>
    <div class="embed-bar">
      <button class="back-link" id="site-back" type="button">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        返回研发工作台
      </button>
      <span class="embed-title" id="site-title"></span>
      <a class="embed-open" id="site-open" href="#" target="_blank" rel="noopener">在新标签打开 →</a>
    </div>
    <iframe class="embed-frame" id="site-frame" title="站点内容"
            referrerpolicy="no-referrer"></iframe>
  </main>

  <!-- 环境详情：环境池占用、健康状态与租约释放 -->
  <main class="app-main" id="view-env" hidden>
    <button class="back-link" id="env-back" type="button">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      返回研发工作台
    </button>
    <h2 class="page-title">ChainWeaver Env</h2>
    <!-- 环境都部署在同一台宿主机上，服务器地址统一在这里说明，不在每行重复 -->
    <p class="env-host-line">宿主机 <span id="env-host">-</span></p>

    <section class="env-summary" aria-label="环境池概况">
      <div class="env-stat"><span class="env-stat-num" id="env-total">-</span><span class="env-stat-label">环境</span></div>
      <div class="env-stat"><span class="env-stat-num" id="env-idle">-</span><span class="env-stat-label">空闲</span></div>
      <div class="env-stat"><span class="env-stat-num" id="env-leased">-</span><span class="env-stat-label">已租用</span></div>
      <div class="env-stat"><span class="env-stat-num" id="env-busy">-</span><span class="env-stat-label">处理中</span></div>
      <div class="env-stat"><span class="env-stat-num" id="env-unhealthy">-</span><span class="env-stat-label">异常</span></div>
      <!-- 更新时间说明的是"刷新"这件事的新鲜度，所以紧挨刷新按钮 -->
      <div class="env-summary-actions">
        <span class="env-updated" id="env-updated"></span>
        <button class="button quiet" id="env-refresh" type="button">刷新</button>
      </div>
    </section>

    <section class="env-list" id="env-list" aria-label="环境列表"></section>
    <p class="history-empty" id="env-empty" hidden>没有环境记录。</p>
    <p class="env-error" id="env-error" hidden></p>

    <!-- 操作记录：cwe 的部署与释放任务 -->
    <section class="env-ops" aria-labelledby="env-ops-title">
      <header class="env-ops-head">
        <h3 id="env-ops-title">操作记录</h3>
        <div class="pager" id="env-ops-pager" hidden>
          <span class="pager-info" id="env-ops-count"></span>
          <button class="pager-btn" type="button" id="env-ops-prev" aria-label="上一页">‹</button>
          <span class="pager-page" id="env-ops-page">1 / 1</span>
          <button class="pager-btn" type="button" id="env-ops-next" aria-label="下一页">›</button>
        </div>
      </header>
      <div class="env-ops-list" id="env-ops-list"></div>
      <p class="history-empty" id="env-ops-empty" hidden>还没有操作记录。</p>
    </section>
  </main>

  <!-- 机器人详情：设置与运行记录 -->
  <main class="app-main" id="view-robot" hidden>
    <button class="back-link" id="robot-back" type="button">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      返回研发工作台
    </button>
    <h2 class="page-title">每日巡检机器人</h2>

    <section class="robot-card" aria-labelledby="robot-card-title">
      <header class="robot-head">
        <div class="robot-head-text">
          <h3 id="robot-card-title">E2E 集成测试 · 每日巡检</h3>
          <p id="robot-summary">每天把所有主流程依次跑一遍，结果发到指定邮箱。</p>
        </div>
        <span class="robot-state" id="robot-state">未执行</span>
      </header>

      <dl class="robot-rows">
        <div class="robot-row">
          <dt>主流程</dt>
          <dd id="robot-suites" role="group" aria-label="主流程"></dd>
        </div>
        <div class="robot-row">
          <dt>每天</dt>
          <dd>
            <!-- 时间用滚轮选择，不让人手打数字：手打容易打出 99 或字母。 -->
            <div class="time-wheels" id="robot-schedule">
              <div class="wheel" id="robot-hour" role="listbox" tabindex="0"
                   aria-label="小时" data-max="23"></div>
              <span class="wheel-colon">:</span>
              <div class="wheel" id="robot-minute" role="listbox" tabindex="0"
                   aria-label="分钟" data-max="59"></div>
            </div>
            <span class="robot-hint" id="robot-next"></span>
          </dd>
        </div>
        <div class="robot-row">
          <dt>收件人</dt>
          <dd>
            <!-- 多收件人：已添加的邮箱以胶囊显示，输入框回车或逗号继续添加，支持群发。 -->
            <div class="mail-chips" id="robot-mailto-chips"></div>
            <input id="robot-mailto" type="text" spellcheck="false" autocomplete="off"
                   aria-label="添加收件人邮箱" placeholder="输入邮箱后回车，可加多个">
          </dd>
        </div>
        <div class="robot-row">
          <dt>启用</dt>
          <dd class="switch-group">
            <label class="switch">
              <input id="robot-enabled" type="checkbox" role="switch">
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              <span class="switch-label">每天定时执行</span>
            </label>
            <label class="switch">
              <input id="robot-sendmail" type="checkbox" role="switch">
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              <span class="switch-label">执行后发邮件</span>
            </label>
          </dd>
        </div>
      </dl>

      <footer class="robot-actions">
        <button class="button quiet" id="robot-save" type="button">保存设置</button>
        <button class="button" id="robot-run" type="button">立即执行一次</button>
      </footer>
    </section>

    <!-- 执行记录：每次批次一行，点击展开看逐套件明细 -->
    <section class="history" aria-labelledby="history-title">
      <header class="history-head">
        <h3 id="history-title">执行记录</h3>
        <div class="pager" id="history-pager" hidden>
          <span class="pager-info" id="history-count"></span>
          <button class="pager-btn" type="button" id="history-prev" aria-label="上一页">‹</button>
          <span class="pager-page" id="history-page">1 / 1</span>
          <button class="pager-btn" type="button" id="history-next" aria-label="下一页">›</button>
        </div>
      </header>
      <div class="history-list" id="history-list"></div>
      <p class="history-empty" id="history-empty" hidden>还没有执行记录。</p>
    </section>
  </main>
</body>
</html>
