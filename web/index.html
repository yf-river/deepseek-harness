<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0052d9">
  <title>ChainWeaver</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#board">跳到主要内容</a>

  <header class="app-header">
    <div class="header-main-row">
      <div class="header-brand">
        <div class="header-logo-icon" aria-hidden="true">
          <!-- 与 favicon 同一枚 C 字标：渐变圆角方块 + 细线 C + 三块站点方块。 -->
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2b7fff"/><stop offset="1" stop-color="#0040b0"/>
            </linearGradient></defs>
            <rect width="64" height="64" rx="14" fill="url(#brandg)"/>
            <path d="M42.5 16.5A17.8 17.8 0 1 0 42.5 47.5" fill="none" stroke="#fff"
              stroke-width="5.6" stroke-linecap="round"/>
            <rect x="26" y="21.5" width="6.8" height="6.8" rx="2" fill="#fff" opacity=".95"/>
            <rect x="32.4" y="28.6" width="6.8" height="6.8" rx="2" fill="#fff" opacity=".78"/>
            <rect x="26" y="35.7" width="6.8" height="6.8" rx="2" fill="#fff" opacity=".6"/>
          </svg>
        </div>
        <div class="header-title">
          <h1 id="portal-title">ChainWeaver</h1>
        </div>
      </div>

      <nav class="header-nav" aria-label="站点导航">
        <div class="nav-tabs" id="nav-tabs" role="tablist"></div>
      </nav>
    </div>
  </header>

  <!-- 首页视图：站点清单 -->
  <main class="app-main" id="view-home">
    <h2 class="page-title" id="page-title">全部站点</h2>

    <section class="site-grid" id="site-grid" aria-label="站点列表"></section>

    <p class="loading" id="loading">正在加载站点清单…</p>

    <!-- 机器人区块：与「全部站点」平级，卡片点进去看设置与运行记录 -->
    <h2 class="page-title section-title">机器人</h2>

    <button class="robot-entry" id="robot-entry" type="button" aria-controls="view-robot">
      <span class="robot-entry-icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.5" y="6.5" width="13" height="9.5" rx="2.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 3v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="10" cy="2.6" r="1.1" fill="currentColor"/>
          <circle cx="7.6" cy="10.8" r="1.15" fill="currentColor"/>
          <circle cx="12.4" cy="10.8" r="1.15" fill="currentColor"/>
          <path d="M8 13.6h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="robot-entry-body">
        <span class="robot-entry-title">E2E 集成测试 · 每日巡检</span>
        <span class="robot-entry-desc" id="robot-entry-desc">每天把选中的主流程依次跑一遍，结果发到指定邮箱。</span>
      </span>
      <span class="robot-entry-status" id="robot-entry-status">未执行</span>
      <span class="robot-entry-go">查看 →</span>
    </button>
  </main>

  <!-- 机器人详情：设置与运行记录 -->
  <main class="app-main" id="view-robot" hidden>
    <button class="back-link" id="robot-back" type="button">← 返回全部站点</button>
    <h2 class="page-title">每日巡检机器人</h2>

    <section class="robot-card" aria-labelledby="robot-card-title">
      <header class="robot-head">
        <div class="robot-head-text">
          <h3 id="robot-card-title">E2E 集成测试 · 每日巡检</h3>
          <p id="robot-summary">每天把选中的主流程依次跑一遍，结果发到指定邮箱。</p>
        </div>
        <span class="robot-state" id="robot-state">未执行</span>
      </header>

      <dl class="robot-rows">
        <div class="robot-row">
          <dt>主流程</dt>
          <dd id="robot-suites"></dd>
        </div>
        <div class="robot-row">
          <dt>每天</dt>
          <dd><input id="robot-schedule" type="time" step="60" aria-label="每日执行时间">
            <span class="robot-hint" id="robot-next"></span></dd>
        </div>
        <div class="robot-row">
          <dt>收件人</dt>
          <dd><input id="robot-mailto" type="text" spellcheck="false" aria-label="收件人邮箱"
                placeholder="yunfeihu@tencent.com"></dd>
        </div>
        <div class="robot-row">
          <dt>启用</dt>
          <dd>
            <label class="robot-toggle"><input id="robot-enabled" type="checkbox"> 每天定时执行</label>
            <label class="robot-toggle"><input id="robot-sendmail" type="checkbox"> 执行后发邮件</label>
          </dd>
        </div>
      </dl>

      <p class="robot-result" id="robot-result" hidden></p>

      <footer class="robot-actions">
        <button class="button quiet" id="robot-save" type="button">保存设置</button>
        <button class="button" id="robot-run" type="button">立即执行一次</button>
      </footer>
    </section>
  </main>
</body>
</html>
